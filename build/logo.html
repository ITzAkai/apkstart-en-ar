<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  App icon source, rendered to src/ui/assets/{logo.png, logo-128.png, appicon.ico} by build/render-logo.js.

  The artwork is build/icon-art.png, a rendered icon generated with ComfyUI (Qwen-Image 2.1; prompt and
  settings in build/icon-art.txt). This page fits it into a rounded tile (a 48-unit grid: tile 2..46,
  radius 12) and leaves everything outside the tile transparent, so the shape stays clean at every size.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; width: 1024px; height: 1024px; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
  <canvas id="c" width="1024" height="1024"></canvas>
  <script>
    const N = 1024;
    const U = N / 48; // one unit of the 48-unit grid
    const img = new Image();
    img.onload = () => {
      const g = document.getElementById('c').getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.save();
      g.beginPath();
      g.roundRect(2 * U, 2 * U, 44 * U, 44 * U, 12 * U);
      g.clip();
      g.drawImage(img, 2 * U, 2 * U, 44 * U, 44 * U);
      g.restore();
      document.body.dataset.ready = '1';
    };
    img.src = 'icon-art.png';
  </script>
</body>
</html>
